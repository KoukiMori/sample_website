<body class="has-video-bg kokushi-pict-page">
    <header>
        <div class="navbar">
            <div class="logo">
                <a href="../../index.html">志摩広域行政組合</a>
            </div>
        </div>
        <div class="dropdown_menu">
            <ul class="nav-list">
                <li><a href="../../index.html">トップページ</a></li>
                <li><a href="../../facility.html">施設紹介</a></li>
                <li><a href="../../usageFlow.html">ご利用について</a></li>
                <li><a href="../../topic.html">お知らせ</a></li>
                <li><a href="../../other.html">その他</a></li>
            </ul>
            <div class="content-area"></div>
        </div>
    </header>
    <div class="header-toggle_btn" aria-label="メニュー"><span class="toggle_btn_icon" aria-hidden="true" role="img" title="メニュー"></span></div>
    <video class="hero-video-bg" id="heroVideoBg" autoplay muted loop playsinline webkit-playsinline preload="metadata" aria-hidden="true"></video>
    <canvas class="hero-video-bg hero-video-chromakey" id="heroVideoCanvas" aria-hidden="true"></canvas>
    <div class="header-overlay"></div>

    <details class="other-facility-nav">
        <summary><span class="other-facility-nav-label">その他施設</span></summary>
        <ul class="other-facility-nav-list">
            <li><a href="../hanazono/hanazono.html">花園寮</a></li>
            <li><a href="../sainiwa/sainwa.html">才庭寮</a></li>
            <li><a href="../fukushi_center/fukushi_center.html">志摩福祉センター</a></li>
        </ul>
    </details>

    <section class="page-content">
        <!-- その施設の施設紹介ページの年間行事へ戻る -->
        <a href="tomoyama.html#events" class="pict-page-back-link" id="pict-back-link">＜ 戻る</a>
        <div class="swiper-body">
            <div id="swiper">
                <img class="swiper-hint" src="../swipe.png" alt="スワイプのヒント">
            </div>
            <nav id="season-nav" class="season-nav" aria-label="季節切り替え"></nav>
        </div>
    </section>

    <script>
    (function () {
        window.CARD_FACILITY_NAME = 'ともやま苑';
        var params = new URLSearchParams(location.search);
        var season = params.get('season') || 'spring';
        var seasonClass = 'season-' + season;
        document.documentElement.classList.remove('season-spring', 'season-summer', 'season-autumn', 'season-winter');
        document.documentElement.classList.add(seasonClass);
        document.body.classList.remove('season-spring', 'season-summer', 'season-autumn', 'season-winter');
        document.body.classList.add(seasonClass);
        fetch('pict.json')
            .then(function (res) { return res.json(); })
            .then(function (data) {
                window.CARD_DATA = data[season] || data.spring || [];
            })
            .catch(function () { window.CARD_DATA = []; })
            .finally(function () {
                var s = document.createElement('script');
                s.src = '../card.js';
                document.body.appendChild(s);
            });
    })();
    </script>
    <script src="../../js/siteConfig.js"></script>
    <script src="../../js/app.js"></script>
    <script src="../../topPage/toppage.js"></script>
    <script src="../../js/facility-detail-nav.js"></script>
    <script>
    (function () {
        var seasons = [
            { id: 'spring', label: '春' },
            { id: 'summer', label: '夏' },
            { id: 'autumn', label: '秋' },
            { id: 'winter', label: '冬' }
        ];
        var params = new URLSearchParams(location.search);
        var current = params.get('season') || 'spring';
        var page = location.pathname.split('/').pop() || 'tomoyamaPict.html';
        var nav = document.getElementById('season-nav');
        if (!nav) return;
        seasons.forEach(function (s) {
            if (s.id === current) {
                var span = document.createElement('span');
                span.className = 'season-nav-btn current';
                span.textContent = s.label;
                span.setAttribute('aria-current', 'page');
                nav.appendChild(span);
            } else {
                var a = document.createElement('a');
                a.className = 'season-nav-btn';
                a.href = page + '?season=' + s.id;
                a.textContent = s.label;
                a.setAttribute('aria-label', s.label + 'の写真へ');
                nav.appendChild(a);
            }
        });
    })();
    </script>
</body>

</html>
