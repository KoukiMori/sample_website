<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../header.css">
    <link rel="stylesheet" href="../../topPage/toppage.css">
    <link rel="stylesheet" href="../../facility-detail.css">
    <link rel="stylesheet" href="../facilitiesStyle.css">
    <link rel="stylesheet" href="../swiper.css">
    <title>国士無双寮 写真 | 摩訶不思行政組合</title>
</head>

<body class="has-video-bg kokushi-pict-page">
    <header>
        <div class="navbar">
            <div class="logo">
                <a href="../../index.html">摩訶不思行政組合</a>
            </div>
        </div>
        <!-- ドロップダウンメニューをheader内に配置 -->
        <div class="dropdown_menu">
            <ul class="nav-list">
                <li><a href="../../index.html">トップページ</a></li>
                <li><a href="../../facility.html">施設紹介</a></li>
                <li><a href="../../usageFlow.html">ご利用について</a></li>
                <li><a href="../../topic.html">お知らせ</a></li>
                <li><a href="../../other.html">その他</a></li>
            </ul>
            <div class="content-area"></div>
        </div>
    </header>
    <div class="header-toggle_btn" aria-label="メニュー"><span class="toggle_btn_icon" aria-hidden="true" role="img" title="メニュー"></span></div>
    <!-- 背景動画（季節に応じて toppage.js で src 設定・クロマキー描画） -->
    <video class="hero-video-bg" id="heroVideoBg" autoplay muted loop playsinline aria-hidden="true"></video>
    <canvas class="hero-video-bg hero-video-chromakey" id="heroVideoCanvas" aria-hidden="true"></canvas>
    <!-- 背景オーバーレイ -->
    <div class="header-overlay"></div>

    <!-- 右端：その他施設へ遷移 -->
    <details class="other-facility-nav">
        <summary><span class="other-facility-nav-label">その他施設</span></summary>
        <ul class="other-facility-nav-list">
            <li><a href="../daisangen/daisangen.html">大三元寮</a></li>
            <li><a href="../rinshan/rinshan.html">嶺上開花苑</a></li>
            <li><a href="../jimukyoku/jimukyoku.html">事務局</a></li>
        </ul>
    </details>

    <!-- メインコンテンツ（topic.html と同様に page-content でラップ・背景動画の手前に表示） -->
    <section class="page-content">
        <!-- 国士無双寮写真ページ専用：swiper.css のみでスタイル管理（他CSSと競合しない） -->

        <div class="swiper-body">
            <div id="swiper"></div>
            <img class="swiper-hint" src="../swipe.png" alt="スワイプのヒント">
        </div>
    </section>

    <!-- pict.json を取得してから card.js を読み込み（季節は URL ?season= で指定） -->
    <script>
    (function () {
        var params = new URLSearchParams(location.search);
        var season = params.get('season') || 'spring';
        fetch('pict.json')
            .then(function (res) { return res.json(); })
            .then(function (data) {
                window.CARD_DATA = data[season] || data.spring || [];
            })
            .catch(function () { window.CARD_DATA = []; })
            .finally(function () {
                var s = document.createElement('script');
                s.src = '../card.js';
                document.body.appendChild(s);
            });
    })();
    </script>
    <script src="../../js/app.js"></script>
    <script src="../../topPage/toppage.js"></script>
    <script src="../../js/facility-detail-nav.js"></script>
</body>

</html>
