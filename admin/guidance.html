<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>施設案内の写真</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <header class="admin-header">
        <div>
            <h1>施設案内の写真</h1>
            <p class="admin-header-note">才庭寮・ともやま苑・花園寮の施設案内は5枚固定です。タイトル・説明・写真を登録します。</p>
        </div>
        <div class="admin-header-actions">
            <label class="password-label">パスワード
                <input type="password" id="adminPassword" autocomplete="current-password">
            </label>
            <button type="button" id="saveBtn" class="btn btn-primary">サーバーに保存</button>
        </div>
    </header>
    <main class="admin-main">
        <p class="admin-nav"><a href="index.html">管理トップ</a></p>
        <section class="toolbar">
            <label>施設
                <select id="facilitySelect">
                    <option value="sainiwa">才庭寮</option>
                    <option value="tomoyama">ともやま苑</option>
                    <option value="hanazono">花園寮</option>
                </select>
            </label>
        </section>
        <p id="status" class="status" role="status"></p>
        <div id="photoList"></div>
    </main>
    <script src="cms-common.js?v=20260925c"></script>
    <script src="guidance-admin.js"></script>
</body>
</html>
