    <script>
        // footer_sectionのスクロールアニメーション（確実に下にスクロールしたときに表示）
        function initFooterScrollAnimation() {
            const footerSection = document.querySelector('.footer_section');
            if (!footerSection) return;

            // footerのIntersection Observer API
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    // 確実に下にスクロールしたとき（footerが画面の80%以上見えたとき）に表示
                    if (entry.isIntersecting && entry.intersectionRatio >= 0.8) {
                        footerSection.classList.add('visible');
                    } else {
                        // スクロールが戻ったときは非表示（逆アニメーション）
                        footerSection.classList.remove('visible');
                    }
                });
            }, {
                // 画面の80%が見えたときにトリガー（確実に下にスクロールしたとき）
                threshold: 0.8,
                // 少し早めにトリガーするためのマージン
                rootMargin: '0px 0px 0px 0px'
            });

            observer.observe(footerSection);
        }

        // ページ読み込み後に実行
        window.addEventListener('DOMContentLoaded', initFooterScrollAnimation);
    </script>
