<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- iOSでステータスバーの色を反映（ホーム画面追加時） -->
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer"
    />
    <!-- Mochiy Pop P Oneフォント読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+P+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="topPage/toppage.css">
    <link rel="stylesheet" href="footer.css">
    <title>志摩広域行政組合</title>
    <!-- 表示切替（デプロイ時は js/siteConfig.js の SHOW_SEASON_SWITCH を false に） -->
    <script src="js/siteConfig.js"></script>
    <script>
        if (typeof SHOW_SEASON_SWITCH !== 'undefined' && !SHOW_SEASON_SWITCH) {
            document.documentElement.classList.add('no-season-switch');
            sessionStorage.removeItem('selectedSeason');
            sessionStorage.removeItem('selectedSeasonMonth');
        }
    </script>
</head>

<body>
    <header>
        <div class="navbar">
            <div class="logo">
                <a href>志摩広域行政組合 </a>
            </div>
        </div>
        <!-- ドロップダウンメニューをheader内に配置 -->
        <div class="dropdown_menu">
            <ul class="nav-list">
                <!-- トップページでは「トップページ」リンクは表示しない -->
                <li>
                    <a href="facility.html">施設紹介</a>
                </li>
                <li>
                    <a href="usageFlow.html">ご利用について</a>
                </li>
                <li>
                    <a href="topic.html">お知らせ</a>
                </li>
                <li>
                    <a href="other.html">その他</a>
                </li>
            </ul>
            <div class="content-area">
                <!-- 右側のコンテンツエリア（必要に応じて追加） -->
            </div>
        </div>
    </header>
    <!-- 詳細ひらく/とじるボタン（ヘッダー枠外・右端に固定表示するためheaderの外に配置） -->
    <div class="header-toggle_btn" aria-label="メニュー"><span class="toggle_btn_icon" aria-hidden="true" role="img" title="メニュー"></span></div>
    <!-- 確認用：動画・グラデーション・イラストの季節切り替え（SHOW_SEASON_SWITCH=false で非表示） -->
    <div class="season-switch" aria-label="季節確認用">
        <label for="seasonSelect">確認用</label>
        <select id="seasonSelect" title="季節を切り替えて表示を確認">
            <option value="spring">春</option>
            <option value="summer">夏</option>
            <option value="autumn">秋</option>
            <option value="winter">冬</option>
        </select>
    </div>
    <!-- 背景オーバーレイ -->
    <div class="header-overlay"></div>
    <!-- プログレスバー（headerの上に配置） -->
    <div class="progress-bar">
        <div class="progress"></div>
    </div>
    <!-- 動画・canvas は body 直下に配置して全季節で画面いっぱいに表示（hero 内だと transform の影響で見切れる場合あり） -->
    <video class="hero-video-bg" id="heroVideoBg" autoplay muted loop playsinline webkit-playsinline preload="metadata" aria-hidden="true">
        <!-- 動画 src は季節に応じて JS で設定 -->
    </video>
    <canvas class="hero-video-bg hero-video-chromakey" id="heroVideoCanvas" aria-hidden="true"></canvas>
    <!-- topTitle と slider の背後で桜動画を再生（緑クロマキー除去は canvas で描画） -->
    <section class="hero-with-video">
        <section class="topTitle">
            <div class="mainTitle">〜ずっと、このまちで〜</span>
            </div>
            <div class="subTitle">地域に根ざした
                <br>福祉サービス</div>
        </section>
        <section class="slider">
            <!-- スライド部分だけ overflow でクリップ（装飾は .slider からはみ出して表示） -->
            <div class="slider-inner">
                <div id="sliderItems"></div>
            </div>
            <!-- カルーセル装飾：右上・左下に桜イラスト（z-indexで前面に表示、クリックは透過） -->
            <img src="otherimage/season/spring2.png" alt="" class="slider-deco slider-deco--topRight" aria-hidden="true">
            <img src="otherimage/season/spring1.png" alt="" class="slider-deco slider-deco--bottomLeft" aria-hidden="true">

            <button id="next">></button>
            <button id="prev"><</button>
        </section>
    </section>
    <section class="topic">
        <div class="topicBox">
            <p class="topicBox-title">お知らせ</p>
            <!-- お知らせリスト（スライダー item 数と同じ件数を表示） -->
            <ul id="topicList" class="topic-list"></ul>
            <!-- もっと見るリンク -->
            <a href="topic.html" class="topic-more">もっと見る →</a>
        </div>
    </section>
    <footer class="footer_section">
        <!-- 施設の連絡先・アクセス情報を表示 -->
        <div class="address_box">
            <p class="company-text">志摩広域行政組合</p>
            <p class="address-text">三重県志摩市阿児町神明1537-1</p>
            <p class="telfax-text">電話 0599-43-2112</p>
            <p class="telfax-text">FAX 0599-43-7279</p>
            <p class="telfax-text">メールアドレス　sikouiki@shima.mctv.ne.jp</p>
            <p class="business_hours-text">
                受付窓口／8:30～17:30
            </p>
            <p class="access-text">三重交通バス
                <br>長沢球場前徒歩1分　近鉄鵜方駅より車で10分</p>
            <!-- Googleマップを別タブで開く -->
            <a class="address-link" href="https://www.google.com/maps/search/?api=1&query=%E5%BF%97%E6%91%A9%E7%89%B9%E5%88%A5%E9%A4%8A%E8%AD%B7%E8%80%81%E4%BA%BA%E3%83%9B%E3%83%BC%E3%83%A0%20%E6%89%8D%E5%BA%AD%E5%AF%AE" target="_blank" rel="noopener">
                Googleマップを開く
            </a>
        </div>
    </footer>
    <script src="js/app.js"></script>
    <!-- スライダー読み込み処理（toppage.jsより先に読み込む） -->
    <script src="other/sliderLoader.js"></script>
    <script src="topPage/toppage.js"></script>
    <!-- お知らせ読み込み処理 -->
    <script src="other/topicLoader.js"></script>
    <!-- GitHub Pages 再デプロイ確認用コメント -->
</body>

</html>
