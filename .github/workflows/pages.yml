name: Deploy GitHub Pages

on:
  push:
    branches:
      - ver4
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # ver4 のコードを取得
      - name: Checkout
        uses: actions/checkout@v4

      # ver4 の内容を gh-pages ブランチへ強制 push（Pages配信用）
      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .
          clean: true
